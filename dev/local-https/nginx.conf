# HTTPS for local development (see compose.yaml).
ssl_certificate     /etc/nginx/keys/server.pem;
ssl_certificate_key /etc/nginx/keys/server.key;

# The dashboard API.
server {
    listen 443 ssl;
    server_name hqg-dashboard-https;

    # Backtest uploads are up to 25 MiB (BACKTEST_UPLOAD_MAX_BYTES), as in prod.
    client_max_body_size 30m;

    # Look the API up in Docker's DNS per request, so the proxy starts without it.
    resolver 127.0.0.11 valid=10s;
    set $api http://hqg-dashboard-api:5000;

    location / {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# The frontend build, for the website readiness check (WEBSITE_READINESS_URL).
server {
    listen 8443 ssl;
    server_name hqg-dashboard-https;
    root /usr/share/nginx/html;
}
