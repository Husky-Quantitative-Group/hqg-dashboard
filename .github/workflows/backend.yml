name: Backend Tests

on:
  pull_request:
    branches: ["main", "prod"]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test the API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hqg
          POSTGRES_PASSWORD: hqg
          POSTGRES_DB: hqg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hqg -d hqg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      TEST_DATABASE_URL: postgresql://hqg:hqg@localhost:5432/hqg_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check formatting and lint
        run: |
          ruff format --check .
          ruff check .

      - name: Run tests
        run: python -m pytest -q
