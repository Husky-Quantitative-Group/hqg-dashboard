name: Deploy frontend to GitHub Pages

on:
  push:
    branches: ["prod"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      IS_PROD: "1"
      CORE_API_URL: ${{ vars.CORE_API_URL }}
      BACKTESTER_URL: ${{ vars.BACKTESTER_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Validate required env vars
        run: |
          test -n "$CORE_API_URL" || (echo "Missing repository variable CORE_API_URL" && exit 1)
          test -n "$BACKTESTER_URL" || (echo "Missing repository variable BACKTESTER_URL" && exit 1)

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/build/client

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
