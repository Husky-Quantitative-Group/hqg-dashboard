name: Terraform Apply

on:
  push:
    branches: ["prod"]
    paths:
      - "infra/**"
      - "aws/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-apply-prod
  cancel-in-progress: false

jobs:
  apply:
    name: Apply Terraform (prod)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    env:
      TF_IN_AUTOMATION: "true"
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Build Lambda layers
        run: bash scripts/build_layers.sh

      - name: Verify AWS role variable is configured
        run: |
          test -n "${{ vars.AWS_APPLY_ROLE_TO_ASSUME }}" || (echo "Missing repository variable AWS_APPLY_ROLE_TO_ASSUME" && exit 1)

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write Terraform backend config
        run: |
          cat > backend.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF

          cat > backend.hcl <<EOF
          bucket         = "hqg-prod-terraform-state"
          key            = "hqg-prod-dashboard/prod/terraform.tfstate"
          region         = "us-east-1"
          dynamodb_table = "hqg-prod-terraform-locks"
          encrypt        = true
          EOF

      - name: Terraform init (S3 backend)
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Terraform plan
        run: terraform plan -input=false -no-color -var-file=prod.tfvars -out=tfplan > plan.txt 2>&1

      - name: Upload terraform plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-apply-plan-${{ github.run_id }}
          path: |
            infra/tfplan
            infra/plan.txt

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan
