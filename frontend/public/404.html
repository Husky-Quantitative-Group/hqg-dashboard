<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // GitHub Pages fallback: rewrite unknown routes back to index.html.
      // Keep 0 segments for custom-domain root hosting.
      const pathSegmentsToKeep = 0;
      const { location } = window;
      const newUrl =
        location.protocol +
        "//" +
        location.hostname +
        (location.port ? `:${location.port}` : "") +
        location.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
        "/?/" +
        location.pathname
          .slice(1)
          .split("/")
          .slice(pathSegmentsToKeep)
          .join("/")
          .replace(/&/g, "~and~") +
        (location.search ? "&" + location.search.slice(1).replace(/&/g, "~and~") : "") +
        location.hash;

      location.replace(newUrl);
    </script>
  </head>
  <body></body>
</html>
